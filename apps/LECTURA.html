<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101113"><title>La Biblioteca</title><style>*{box-sizing:border-box}body{margin:0;background:#101113;color:#e9e3d7;font:15px system-ui,sans-serif}main{max-width:760px;margin:auto;padding:22px 16px 90px}h1{font:700 32px Georgia,serif;color:#e8c783;margin:8px 0}h2{font:700 21px Georgia,serif;color:#e8c783}p,small{color:#c6bfae}header{padding:22px 0;border-bottom:1px solid #685532}section{margin:18px 0;padding:18px;border:1px solid #6d5938;border-radius:16px;background:#1b1c1b}input,textarea,select,button{font:inherit;border-radius:9px}input,textarea,select{width:100%;padding:12px;background:#111313;border:1px solid #706044;color:#f1e5c9;margin:6px 0 12px}textarea{min-height:90px;resize:vertical}button{padding:11px 14px;border:1px solid #b89a60;background:#322b1f;color:#f1dfb7;cursor:pointer;margin:3px 4px 3px 0}button:focus-visible,input:focus-visible{outline:2px solid #f3c978}article{padding:14px;margin:12px 0;border-radius:12px;background:#24231f;border:1px solid #504733}strong{color:#f0d59e}.row{display:flex;flex-wrap:wrap;align-items:center;gap:7px}.row>*{flex:1 1 130px}.muted{opacity:.78}.empty{padding:20px;text-align:center}.badge{font-size:12px;color:#ebc783}</style></head><body><main><header><small>AD MELIORA · NUEVO MÓDULO</small><h1>La Biblioteca</h1><p>Tu rincón de lectura personal.</p></header><section><h2>📚 Añadir libro</h2><form id="form"><input name="title" placeholder="Título del libro" maxlength="150" required><input name="author" placeholder="Autor" maxlength="120"><div class="row"><label>Estado<select name="status"><option>Quiero leer</option><option>Leyendo</option><option>Terminado</option></select></label><label>Página actual<input type="number" name="page" min="0" value="0"></label><label>Páginas totales<input type="number" name="total" min="0" value="0"></label></div><textarea name="note" placeholder="Notas, impresiones o citas propias"></textarea><button>Guardar libro</button></form></section><section><h2>Mi biblioteca</h2><div id="list"></div></section></main><script>const KEY='AD_MELIORA_MOD_'+location.pathname.split('/').pop();let items=[];try{items=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(items))items=[]}catch(e){items=[]}const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(KEY,JSON.stringify(items));return true}catch(e){alert('No se pudo guardar. Comprueba el espacio disponible.');return false}}function removeItem(id){if(!confirm('¿Eliminar este elemento?'))return;const previous=items;items=items.filter(x=>x.id!==id);if(!save()){items=previous;return}render()}function addItem(obj){const next={...obj,id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),created:new Date().toISOString()};items.unshift(next);if(!save()){items.shift();return false}render();return true}function editItem(id){const item=items.find(x=>x.id===id);if(!item)return;const form=$('form');for(const field of form.elements){if(field.name&&Object.prototype.hasOwnProperty.call(item,field.name))field.value=item[field.name]}form.dataset.editId=id;const btn=form.querySelector('button[type=submit],button:not([type])');if(btn)btn.textContent='Guardar cambios';form.scrollIntoView({behavior:'smooth',block:'start'});form.querySelector('input,textarea,select')?.focus()}function finishEdit(){const form=$('form');delete form.dataset.editId;const btn=form.querySelector('button[type=submit],button:not([type])');if(btn)btn.textContent='Guardar libro'}function upsert(obj){const id=$('form').dataset.editId;if(!id)return addItem(obj);const i=items.findIndex(x=>x.id===id);if(i<0)return false;const previous={...items[i]};items[i]={...previous,...obj};if(!save()){items[i]=previous;return false}finishEdit();render();return true}$('form').onsubmit=e=>{e.preventDefault();const d=new FormData(e.target);if(upsert(Object.fromEntries(d)))e.target.reset()};function render(){$('list').innerHTML=items.length?items.map(x=>`<article><strong>${esc(x.title)}</strong><p>${esc(x.author)} · ${esc(x.status)}</p><small>Página ${esc(x.page||0)} de ${esc(x.total||'?')}</small><p>${esc(x.note)}</p><button data-edit="${esc(x.id)}">Editar</button><button data-del="${esc(x.id)}">Eliminar</button></article>`).join(''):'<p class="empty">Todavía no hay libros.</p>'}document.addEventListener('click',e=>{if(e.target.dataset.edit)editItem(e.target.dataset.edit);const id=e.target.dataset.del;if(id)removeItem(id)});render();</script></body></html>
