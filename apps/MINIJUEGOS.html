<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101113"><title>Sala de Juegos</title><style>*{box-sizing:border-box}body{margin:0;background:#101113;color:#e9e3d7;font:15px system-ui,sans-serif}main{max-width:760px;margin:auto;padding:22px 16px 90px}h1{font:700 32px Georgia,serif;color:#e8c783;margin:8px 0}h2{font:700 21px Georgia,serif;color:#e8c783}p,small{color:#c6bfae}header{padding:22px 0;border-bottom:1px solid #685532}section{margin:18px 0;padding:18px;border:1px solid #6d5938;border-radius:16px;background:#1b1c1b}input,textarea,select,button{font:inherit;border-radius:9px}input,textarea,select{width:100%;padding:12px;background:#111313;border:1px solid #706044;color:#f1e5c9;margin:6px 0 12px}textarea{min-height:90px;resize:vertical}button{padding:11px 14px;border:1px solid #b89a60;background:#322b1f;color:#f1dfb7;cursor:pointer;margin:3px 4px 3px 0}button:focus-visible,input:focus-visible{outline:2px solid #f3c978}article{padding:14px;margin:12px 0;border-radius:12px;background:#24231f;border:1px solid #504733}strong{color:#f0d59e}.row{display:flex;flex-wrap:wrap;align-items:center;gap:7px}.row>*{flex:1 1 130px}.muted{opacity:.78}.empty{padding:20px;text-align:center}.badge{font-size:12px;color:#ebc783}</style></head><body><main><header><small>AD MELIORA · NUEVO MÓDULO</small><h1>Sala de Juegos</h1><p>Un pequeño reto cada vez.</p></header><section><h2>🎮 Tres en raya</h2><p id="status">Turno de X</p><div id="board" style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-width:330px;margin:auto"></div><p><button id="reset">Nueva partida</button></p><p id="score"></p></section><section><h2>🧠 Memoria rápida</h2><p>Observa la secuencia y repítela.</p><button id="startMemory">Empezar</button><p id="memoryStatus"></p><div id="memoryBtns" class="row"></div></section></main><script>const KEY='AD_MELIORA_MOD_'+location.pathname.split('/').pop();let items=[];try{items=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(items))items=[]}catch(e){items=[]}const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(KEY,JSON.stringify(items));return true}catch(e){alert('No se pudo guardar. Comprueba el espacio disponible.');return false}}function removeItem(id){if(!confirm('¿Eliminar este elemento?'))return;const previous=items;items=items.filter(x=>x.id!==id);if(!save()){items=previous;return}render()}function addItem(obj){items.unshift({...obj,id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),created:new Date().toISOString()});save();render()}let board=Array(9).fill(''),turn='X',over=false;function winner(){for(const [a,b,c] of [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]])if(board[a]&&board[a]===board[b]&&board[b]===board[c])return board[a];return board.every(Boolean)?'Empate':null}function render(){ $('board').innerHTML=board.map((v,i)=>`<button data-cell="${i}" style="height:82px;font-size:35px">${v}</button>`).join('');$('status').textContent=over?(winner()==='Empate'?'Empate':'Ganó '+winner()):'Turno de '+turn;$('score').textContent='Partidas ganadas X: '+(Number(localStorage.getItem('ADM_TTT_X')||0))+' · O: '+(Number(localStorage.getItem('ADM_TTT_O')||0))}document.addEventListener('click',e=>{if(e.target.dataset.cell!==undefined){const i=+e.target.dataset.cell;if(over||board[i])return;board[i]=turn;const w=winner();if(w){over=true;if(w!=='Empate'){const key='ADM_TTT_'+w;localStorage.setItem(key,Number(localStorage.getItem(key)||0)+1)}}else turn=turn==='X'?'O':'X';render()}});$('reset').onclick=()=>{board=Array(9).fill('');turn='X';over=false;render()};render();let sequence=[],inputIndex=0,ready=false;const symbols=['🌙','⭐','🛡️','📚'];$('memoryBtns').innerHTML=symbols.map((s,i)=>`<button data-symbol="${i}" style="font-size:26px">${s}</button>`).join('');$('startMemory').onclick=()=>{sequence=Array.from({length:3},()=>Math.floor(Math.random()*4));inputIndex=0;ready=false;$('memoryStatus').textContent='Recuerda: '+sequence.map(i=>symbols[i]).join(' ');setTimeout(()=>{ready=true;$('memoryStatus').textContent='Repite la secuencia'},2600)};$('memoryBtns').onclick=e=>{if(!ready||e.target.dataset.symbol===undefined)return;const n=+e.target.dataset.symbol;if(n!==sequence[inputIndex]){ready=false;$('memoryStatus').textContent='Inténtalo otra vez';return}inputIndex++;if(inputIndex===sequence.length){ready=false;$('memoryStatus').textContent='¡Correcto!';}else $('memoryStatus').textContent='Bien, continúa ('+inputIndex+'/'+sequence.length+')'};</script></body></html>
