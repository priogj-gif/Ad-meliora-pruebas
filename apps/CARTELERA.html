}
body{background:radial-gradient(ellipse at 50% -18%,#263746 0,#111720 38%,#080b10 78%);color:var(--ink)}
main{max-width:1320px;padding:18px 22px 36px}

,"cast":"Myrna Loy, Fredric March","category":"Drama","country":"Estados Unidos","decade":"Hasta 1959"},{"original":"The Heiress","spanish":"La heredera","year":1949,"director":"William Wyler","cast":"Olivia de Havilland, Montgomery Clift","category":"Drama","country":"Estados Unidos","decade":"Hasta 1959"},{"original":"The Quiet Man","spanish":"El hombre tranquilo","year":1952,"director":"John Ford","cast":"John Wayne, Maureen O'Hara","category":"Comedia · Drama","country":"Estados Unidos","decade":"Hasta 1959"},{"original":"Some Came Running","spanish":"Como un torrente","year":1958,"director":"Vincente Minnelli","cast":"Frank Sinatra, Shirley MacLaine","category":"Drama","country":"Estados Unidos","decade":"Hasta 1959"},{"original":"The Last Detail","spanish":"El último deber","year":1973,"director":"Hal Ashby","cast":"Jack Nicholson, Otis Young","category":"Comedia · Drama","country":"Estados Unidos","decade":"1970s"},{"original":"The Rocky Horror Picture Show","spanish":"The Rocky Horror Picture Show","year":1975,"director":"Jim Sharman","cast":"Tim Curry, Susan Sarandon","category":"Musical · Comedia","country":"Estados Unidos","decade":"1970s"},{"original":"Stand by Me","spanish":"Cuenta conmigo","year":1986,"director":"Rob Reiner","cast":"Wil Wheaton, River Phoenix","category":"Drama · Aventura","country":"Estados Unidos","decade":"1980s"},{"original":"Full Metal Jacket","spanish":"La chaqueta metálica","year":1987,"director":"Stanley Kubrick","cast":"Matthew Modine, R. Lee Ermey","category":"Bélico · Drama","country":"Estados Unidos","decade":"1980s"},{"original":"Edward Scissorhands","spanish":"Eduardo Manostijeras","year":1990,"director":"Tim Burton","cast":"Johnny Depp, Winona Ryder","category":"Fantasía · Drama","country":"Estados Unidos","decade":"1990s"},{"original":"The Nightmare Before Christmas","spanish":"Pesadilla antes de Navidad","year":1993,"director":"Henry Selick","cast":"Danny Elfman, Chris Sarandon","category":"Animación · Fantasía","country":"Estados Unidos","decade":"1990s"},{"original":"The Florida Project","spanish":"The Florida Project","year":2017,"director":"Sean Baker","cast":"Brooklynn Prince, Willem Dafoe","category":"Drama","country":"Estados Unidos","decade":"2010s"},{"original":"El último caballo","spanish":"El último caballo","year":1950,"director":"Edgar Neville","cast":"Fernando Fernán-Gómez, Conchita Montes","category":"Comedia","country":"España","decade":"Hasta 1959"},{"original":"Muerte de un ciclista","spanish":"Muerte de un ciclista","year":1955,"director":"Juan Antonio Bardem","cast":"Lucía Bosé, Alberto Closas","category":"Drama","country":"España","decade":"Hasta 1959"},{"original":"The Great Dictator","spanish":"El gran dictador","year":1940,"director":"Charles Chaplin","cast":"Charles Chaplin, Paulette Goddard","category":"Comedia · Drama","country":"Estados Unidos","decade":"Hasta 1959"},{"original":"The Third Man","spanish":"El tercer hombre","year":1949,"director":"Carol Reed","cast":"Joseph Cotten, Orson Welles","category":"Cine negro · Misterio","country":"Reino Unido","decade":"Hasta 1959"},{"original":"The Day the Earth Stood Still","spanish":"Ultimátum a la Tierra","year":1951,"director":"Robert Wise","cast":"Michael Rennie, Patricia Neal","category":"Ciencia ficción","country":"Estados Unidos","decade":"Hasta 1959"},{"original":"The Bridge on the River Kwai","spanish":"El puente sobre el río Kwai","year":1957,"director":"David Lean","cast":"William Holden, Alec Guinness","category":"Bélico · Drama","country":"Reino Unido","decade":"Hasta 1959"},{"original":"The Lord of the Rings: The Return of the King","spanish":"El señor de los anillos: El retorno del rey","year":2003,"director":"Peter Jackson","cast":"Elijah Wood, Viggo Mortensen","category":"Fantasía · Aventura","country":"Estados Unidos · Nueva Zelanda","decade":"2000s"},{"original":"El clavo","spanish":"El clavo","year":1944,"director":"Rafael Gil","cast":"Amparo Rivelles, Rafael Durán","category":"Drama · Misterio","country":"España","decade":"Hasta 1959"},{"original":"The Kid","spanish":"El chico","year":1921,"director":"Charles Chaplin","cast":"Charles Chaplin, Jackie Coogan","category":"Comedia · Drama","country":"Estados Unidos","decade":"Hasta 1959"},{"original":"The Crowd","spanish":"Y el mundo marcha","year":1928,"director":"King Vidor","cast":"James Murray, Eleanor Boardman","category":"Drama","country":"Estados Unidos","decade":"Hasta 1959"},{"original":"Freaks","spanish":"La parada de los monstruos","year":1932,"director":"Tod Browning","cast":"Wallace Ford, Leila Hyams","category":"Drama · Terror","country":"Estados Unidos","decade":"Hasta 1959"},{"original":"The Ox-Bow Incident","spanish":"Incidente en Ox-Bow","year":1943,"director":"William A. Wellman","cast":"Henry Fonda, Dana Andrews","category":"Western · Drama","country":"Estados Unidos","decade":"Hasta 1959"},{"original":"The Naked City","spanish":"La ciudad desnuda","year":1948,"director":"Jules Dassin","cast":"Barry Fitzgerald, Howard Duff","category":"Cine negro","country":"Estados Unidos","decade":"Hasta 1959"},{"original":"The Cameraman","spanish":"El cameraman","year":1928,"director":"Edward Sedgwick, Buster Keaton","cast":"Buster Keaton, Marceline Day","category":"Comedia","country":"Estados Unidos","decade":"Hasta 1959"},{"original":"Tierra","spanish":"Tierra","year":1996,"director":"Julio Medem","cast":"Carmelo Gómez, Emma Suárez","category":"Drama · Fantasía","country":"España","decade":"1990s"},{"original":"El método","spanish":"El método","year":2005,"director":"Marcelo Piñeyro","cast":"Eduard Fernández, Najwa Nimri","category":"Drama · Thriller","country":"España","decade":"2000s"},{"original":"The Insider","spanish":"El dilema","year":1999,"director":"Michael Mann","cast":"Al Pacino, Russell Crowe","category":"Drama · Thriller","country":"Estados Unidos","decade":"1990s"},{"original":"The Straight Story","spanish":"Una historia verdadera","year":1999,"director":"David Lynch","cast":"Richard Farnsworth, Sissy Spacek","category":"Drama · Aventura","country":"Estados Unidos","decade":"1990s"}];
const $=id=>document.getElementById(id);
const norm=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const genres=[...new Set(movies.flatMap(m=>m.category.split(" · ")))].sort();
const countries=[...new Set(movies.flatMap(m=>m.country.split(" · ")))].sort();
const decades=["Hasta 1959","1960s","1970s","1980s","1990s","2000s","2010s","2020s"];
genres.forEach(x=>$("genre").add(new Option(x,x)));
countries.forEach(x=>$("country").add(new Option(x,x)));
let selected=null;
function matches(m,q){return !q||[m.original,m.spanish,m.director,m.cast,m.year,m.category,m.country].some(v=>norm(v).includes(norm(q)))}
function filtered(){let q=$("search").value.trim(),g=$("genre").value,c=$("country").value;return movies.filter(m=>matches(m,q)&&(!g||m.category.split(" · ").includes(g))&&(!c||m.country.split(" · ").includes(c)))}
function card(m){let i=movies.indexOf(m);return `<article class="movie" tabindex="0" onclick="showDetail(${i})" onkeydown="if(event.key==='Enter')showDetail(${i})"><div class="poster"><img class="poster-img" data-movie="${i}" alt="Cartel de ${m.spanish}" loading="lazy"><b>${m.spanish}</b></div><div class="movieinfo"><strong>${m.original}</strong><small>${m.year} · ${m.category}</small></div></article>`}

const posterCache={},posterPending={};
async function fetchPoster(m){
 const cacheKey=norm(m.original)+"|"+norm(m.spanish);
 if(posterCache[cacheKey]!==undefined)return posterCache[cacheKey];
 if(posterPending[cacheKey])return posterPending[cacheKey];
 const pending=posterPending[cacheKey]=(async()=>{
  const titles=[m.original,m.spanish];
  for(const lang of ["en","es"]){
   for(const title of titles){
    try{
     const url=`https://${lang}.wikipedia.org/w/api.php?action=query&format=json&origin=*&prop=pageimages&piprop=thumbnail&pithumbsize=500&redirects=1&titles=${encodeURIComponent(title)}`;
     const response=await fetch(url);
     if(!response.ok)continue;
     const data=await response.json();
     const pages=data?.query?.pages||{};
     const page=Object.values(pages)[0];
     const image=page?.thumbnail?.source;
     if(image)return image;
    }catch(e){}
   }
  }
  return "";
 })();
 try{const image=await pending;if(posterPending[cacheKey]===pending)posterCache[cacheKey]=image;return image}
 finally{if(posterPending[cacheKey]===pending)delete posterPending[cacheKey]}
}
async function loadPosters(){
 const imgs=[...document.querySelectorAll(".poster-img:not([src])")];
 for(let n=0;n<imgs.length;n+=5){
  await Promise.all(imgs.slice(n,n+5).map(async img=>{
   const movie=movies[Number(img.dataset.movie)];
   if(!movie)return;
   const src=await fetchPoster(movie);
   if(src){img.src=src;img.style.display="block";}
   else{img.remove();}
  }));
 }
}

window.addEventListener("online",()=>{let retry=false;for(const key of Object.keys(posterCache)){if(posterCache[key]===""){delete posterCache[key];retry=true}}for(const key of Object.keys(posterPending)){delete posterPending[key];retry=true}if(retry)render()});
function render(){
 let list=filtered(), searching=$("search").value.trim().length>0;
 $("resultCount").textContent=list.length;
 let groups=decades.map(d=>{
  let items=list.filter(m=>m.decade===d);
  return items.length?`<details class="year-group" ${searching?"open":""}><summary>${d}<span>${items.length} películas</span></summary><div class="grid">${items.map(card).join("")}</div></details>`:"";
 }).join("");
 $("decades").innerHTML=list.length?`<details class="years-panel" ${searching?"open":""}><summary>Años y películas <span>${list.length} títulos</span></summary><div class="year-list">${groups}</div></details>`:'<div class="empty">No hay películas que coincidan con la búsqueda.</div>';
 loadPosters();
}
function suggestions(){let q=$("search").value.trim(),box=$("suggestions");if(!q){box.style.display="none";return}let items=movies.filter(m=>matches(m,q)).slice(0,8);box.innerHTML=items.map(m=>`<div class="suggestion" onclick="pick(${movies.indexOf(m)})"><b>${m.spanish}</b> · ${m.year}<br><small>${m.original} · ${m.director}</small></div>`).join("")||'<div class="suggestion">Sin coincidencias</div>';box.style.display="block"}
function pick(i){$("search").value=movies[i].spanish;$("suggestions").style.display="none";render();showDetail(i)}
function showDetail(i){let m=movies[i];selected=i;$("detailcontent").innerHTML=`<div class="detailposter" id="detailposter">${m.spanish}</div><h2>${m.original}</h2><p><b>Título en español:</b> ${m.spanish}</p><p><b>Director:</b> ${m.director}</p><p><b>Actores y actrices:</b> ${m.cast}</p><p><b>Año:</b> ${m.year}</p><p><b>Categoría:</b> ${m.category}</p><p><b>País:</b> ${m.country}</p><p><label>Mi estado <select id="personalState"><option>Pendiente</option><option>Vista</option><option>Favorita</option></select></label></p><p><label>Mi valoración <select id="personalRating"><option value="">Sin valorar</option>${Array.from({length:11},(_,n)=>`<option>${n}/10</option>`).join("")}</select></label></p><button onclick="savePersonal()">Guardar mi ficha</button><small id="saved"></small>`;$("detail").style.display="block";loadPersonal(i);fetchPoster(m).then(src=>{if(selected!==i)return;let box=$("detailposter");if(src&&box){box.style.backgroundImage=`url("${src}")`;box.style.backgroundSize="cover";box.style.backgroundPosition="center";box.style.color="#fff";box.style.textShadow="0 2px 8px #000"}})}
function closeDetail(){$("detail").style.display="none"}
function key(i){return "cartelera-personal-"+i}
function loadPersonal(i){
 try{
  const raw=localStorage.getItem(key(i));if(!raw)return;
  const x=JSON.parse(raw);if(!x||typeof x!=="object"||Array.isArray(x))return;
  if(["Pendiente","Vista","Favorita"].includes(x.state))$("personalState").value=x.state;
  if(typeof x.rating==="string"&&(["",...Array.from({length:11},(_,n)=>n+"/10")].includes(x.rating)))$("personalRating").value=x.rating;
 }catch(e){console.warn("No se pudo leer la ficha personal guardada",e)}
}
function savePersonal(){
 const x={state:$("personalState").value,rating:$("personalRating").value};
 try{localStorage.setItem(key(selected),JSON.stringify(x));$("saved").textContent=" · Guardado"}
 catch(e){$("saved").textContent=" · No se pudo guardar en este dispositivo";console.warn("No se pudo guardar la ficha personal",e)}
}
$("search").addEventListener("input",()=>{suggestions();render()});
$("search").addEventListener("keydown",e=>{if(e.key==="Escape")$("suggestions").style.display="none";if(e.key==="Enter"){$("suggestions").style.display="none";render()}});
$("genre").addEventListener("change",render);$("country").addEventListener("change",render);
$("expandAll").addEventListener("click",()=>{document.querySelectorAll("#decades details").forEach(d=>d.open=true)});
$("collapseAll").addEventListener("click",()=>{document.querySelectorAll("#decades details").forEach(d=>d.open=false)});
$("clearFilters").addEventListener("click",()=>{$("search").value="";$("genre").value="";$("country").value="";$("suggestions").style.display="none";render()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDetail()});
document.addEventListener("click",e=>{if(!e.target.closest(".searchbox"))$("suggestions").style.display="none"});
render();

// Coloca las sugerencias dentro del viewport REAL del móvil, que se reduce al abrir el teclado.
(function(){
 const input=document.getElementById('search'), box=document.getElementById('suggestions');
 if(!input||!box)return;
 function placeSuggestions(){
  if(!window.matchMedia('(max-width:700px)').matches||box.style.display==='none')return;
  const r=input.getBoundingClientRect(), vv=window.visualViewport;
  const topView=vv?vv.offsetTop:0, bottomView=vv?vv.offsetTop+vv.height:window.innerHeight;
  const gap=7, availableBelow=bottomView-r.bottom-gap, availableAbove=r.top-topView-gap;
  let top,max;
  if(availableBelow>=105){top=r.bottom+gap;max=Math.min(260,availableBelow)}
  else if(availableAbove>=85){max=Math.min(260,availableAbove);top=r.top-gap-max}
  else{top=topView+6;max=Math.max(70,bottomView-top-6)}
  box.style.top=Math.max(topView+4,top)+'px';
  box.style.maxHeight=Math.max(70,max)+'px';
 }
 function revealInput(){
  if(!window.matchMedia('(max-width:700px)').matches)return;
  const r=input.getBoundingClientRect(), vv=window.visualViewport;
  const bottom=vv?vv.offsetTop+vv.height:window.innerHeight;
  if(r.top<(vv?vv.offsetTop:0)+4)window.scrollBy({top:r.top-(vv?vv.offsetTop:0)-8,behavior:'auto'});else if(r.bottom>bottom-45)window.scrollBy({top:r.bottom-bottom+60,behavior:'auto'});
 }
 input.addEventListener('focus',()=>setTimeout(()=>{revealInput();placeSuggestions()},250));
 input.addEventListener('input',()=>requestAnimationFrame(placeSuggestions));
 if(window.visualViewport){
  window.visualViewport.addEventListener('resize',()=>{revealInput();placeSuggestions()});
  window.visualViewport.addEventListener('scroll',placeSuggestions);
 }
 window.addEventListener('scroll',placeSuggestions,{passive:true});
 const observer=new MutationObserver(placeSuggestions);
 observer.observe(box,{attributes:true,attributeFilter:['style']});
})();
</script></body></html>
